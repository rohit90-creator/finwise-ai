<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FinWise AI</title><style>
:root{--bg:#0b1220;--card:#131c2e;--tx:#e8eef9;--mu:#8a97b2;--ac:#10b981;--ac2:#3b82f6;--bd:#223049;--bad:#f43f5e}
[data-theme=light]{--bg:#f3f6fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0}
*{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px)}nav{padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:9;overflow-x:auto}
nav a{flex:1;min-width:62px;padding:9px 4px;text-align:center;font-size:11px;color:var(--mu);cursor:pointer;white-space:nowrap}
nav a span{display:block;font-size:18px}nav a.on{color:var(--ac)}nav h2{display:none}
main{padding:16px 14px 90px;max-width:1100px;margin:auto;animation:f .3s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{margin:4px 0 14px;font-size:24px}h3{margin:0 0 10px;font-size:15px}
.g,.g2{display:grid;gap:12px;margin-bottom:12px}.g{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}.c small,small{color:var(--mu)}.big{display:block;font-size:20px;margin-top:4px}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;border-radius:9px;transition:width .5s}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 8px}input,select{width:100%;padding:9px;margin-top:3px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:9px;font-size:15px}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;margin:2px}button.s{background:var(--bd);color:var(--tx)}
.ch{width:100%;height:auto}.t{font-size:9px;fill:var(--mu)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.hr{margin-bottom:10px}.hr div{display:flex;justify-content:space-between}.hr small{font-size:11px}
#chat{height:52vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:10px}.m{padding:10px 12px;border-radius:14px;max-width:92%;line-height:1.45}.u{align-self:flex-end;background:var(--ac2);color:#fff}.a{background:var(--card);border:1px solid var(--bd)}
.row{display:flex;gap:8px}.row input{flex:1}.leg span{margin-right:12px;font-size:12px}
@media(min-width:800px){nav{top:0;right:auto;width:210px;flex-direction:column;border:0;border-right:1px solid var(--bd);padding:14px 8px}nav h2{display:block;margin:6px 12px 14px;color:var(--ac)}nav a{flex:none;text-align:left;font-size:14px;padding:11px 12px;border-radius:10px}nav a span{display:inline;margin-right:8px;font-size:15px}nav a.on{background:var(--bg)}main{margin-left:225px;padding-bottom:30px}}
</style></head><body><nav id=nav></nav><main id=main></main><script>
const D={p:{inc:150000,oth:10000,age:30,cur:'INR',fix:50000,var:30000,sav:300000,inv:800000,debt:400000,risk:'Moderate',ret:10},
b:{needs:50,wants:20,sav:10,inv:15,debt:5},
g:[{n:'Emergency fund',t:600000,c:300000,m:10000,r:5},{n:'Car',t:1200000,c:150000,m:15000,r:8},{n:'₹1 crore',t:10000000,c:800000,m:25000,r:10}],
a:{Cash:20000,'Bank balance':300000,Investments:800000,Property:0,Vehicles:350000,'Business assets':0},
l:{'Home loan':0,'Car loan':0,'Personal loan':400000,'Credit card debt':0,'Other debt':0},
h:[{l:'Apr',v:600000},{l:'May',v:660000},{l:'Jun',v:700000},{l:'Jul',v:790000},{l:'Aug',v:850000},{l:'Sep',v:890000}]};
let S;try{S=JSON.parse(localStorage.fw||'null')}catch(e){}S=S||structuredClone(D);let tab='dash';const save=()=>{try{localStorage.fw=JSON.stringify(S)}catch(e){}};
const $=n=>new Intl.NumberFormat(S.p.cur=='INR'?'en-IN':'en-US',{style:'currency',currency:S.p.cur,maximumFractionDigits:0}).format(n||0);
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const M=()=>{const p=S.p,inc=p.inc+p.oth,exp=p.fix+p.var,sur=inc-exp,A=sum(S.a),L=sum(S.l);return{inc,exp,sur,rate:inc?sur/inc*100:0,em:exp?p.sav/exp:0,dti:inc?p.debt/(inc*12):0,A,L,nw:A-L}};
const fv=(P,m,r,y,st=0)=>{let b=P,i=r/1200;for(let k=0;k<y*12;k++)b=b*(1+i)+m*(1+st)**Math.floor(k/12);return b};
const ser=(P,m,r,y,st)=>Array.from({length:y+1},(_,t)=>fv(P,m,r,t,st));
const emi=(P,r,n)=>{const i=r/1200;return i?P*i*(1+i)**n/((1+i)**n-1):P/n};
const mos=(c,t,m,r)=>{if(c>=t)return 0;let b=c,i=r/1200;for(let k=1;k<=1200;k++){b=b*(1+i)+m;if(b>=t)return k}return Infinity};
const dur=n=>n==Infinity?'50+ yrs':n<1?'Reached':(n/12).toFixed(1)+' yrs';
const card=(t,b)=>`<div class=c><h3>${t}</h3>${b}</div>`,stat=(l,v)=>`<div class=c><small>${l}</small><b class=big>${v}</b></div>`;
const bar=(p,c='var(--ac)')=>`<div class=bar><i style="width:${Math.min(100,Math.max(0,p))}%;background:${c}"></i></div>`;
const N=(id,l,v,st=1)=>`<label>${l}<input id=${id} type=number step=${st} value=${v} oninput=calc()></label>`;
const g=id=>+document.getElementById(id).value||0,out=h=>document.getElementById('out').innerHTML=h;
const hr=(l,v,p,n)=>`<div class=hr><div><span>${l}</span><b>${v}</b></div>${bar(p)}<small>${n}</small></div>`;
function line(ss,lb){const all=ss.flatMap(s=>s.d),mx=Math.max(...all),mn=Math.min(0,...all),y=v=>150-(v-mn)/(mx-mn||1)*150;
return `<svg viewBox="0 -8 400 178" class=ch>${ss.map(s=>`<polyline fill=none stroke="${s.c}" stroke-width=2.5 points="${s.d.map((v,i)=>(i*400/(s.d.length-1||1))+','+y(v)).join(' ')}"/>`).join('')}<text x=2 y=4 class=t>${$(mx)}</text><text x=0 y=168 class=t>${lb[0]}</text><text x=400 y=168 text-anchor=end class=t>${lb[lb.length-1]}</text></svg><div class=leg>${ss.map(s=>`<span style=color:${s.c}>● ${s.n}</span>`).join('')}</div>`}
const V={},C={};
V.dash=()=>{const m=M(),gp=S.g.reduce((a,x)=>a+Math.min(1,x.c/x.t),0)/(S.g.length||1)*100;
return `<h1>Dashboard</h1><div class=g>${stat('Monthly income',$(m.inc))}${stat('Monthly expenses',$(m.exp))}${stat('Monthly surplus',$(m.sur))}${stat('Savings rate',m.rate.toFixed(0)+'%')}${stat('Total savings',$(S.p.sav))}${stat('Investments',$(S.p.inv))}${stat('Total debt',$(S.p.debt))}${stat('Net worth',$(m.nw))}</div>
<div class=g2>${card('Emergency fund (6 months target)',`<b class=big>${m.em.toFixed(1)} / 6 months</b>${bar(m.em/6*100)}<small>${$(S.p.sav)} of ${$(m.exp*6)}</small>`)}
${card('Financial health indicators',hr('Savings rate',m.rate.toFixed(0)+'%',m.rate/20*100,'Common benchmark: 20%+')+hr('Emergency fund',m.em.toFixed(1)+' mo',m.em/6*100,'3–6 months of expenses is typical')+hr('Debt ÷ annual income',m.dti.toFixed(2),100-m.dti*200,'Lower is generally better')+hr('Investing (budget plan)',S.b.inv+'% of income',S.b.inv/15*100,'Share of income planned for investing')+hr('Goal progress',gp.toFixed(0)+'%',gp,'Average across your goals')+hr('Cash-flow surplus',$(m.sur),m.rate,'Income minus expenses'))}
${card('Goals',S.g.map(x=>`<div class=hr><div><span>${x.n}</span><b>${(x.c/x.t*100).toFixed(0)}%</b></div>${bar(x.c/x.t*100,'var(--ac2)')}</div>`).join('')||'No goals yet')}
${card('Net worth history',line([{n:'Net worth',c:'#10b981',d:S.h.map(x=>x.v)}],S.h.map(x=>x.l)))}</div>`};
V.bud=()=>{const k=[['needs','Needs'],['wants','Wants'],['sav','Savings'],['inv','Investments'],['debt','Debt repayment']];
return `<h1>Budget Planner</h1><div class=g2>${card('Customize split (%)',k.map(([a,b])=>N('b_'+a,b+' %',S.b[a])).join('')+`<button class=s onclick="S.b=structuredClone(D.b);save();render()">Reset 50/20/10/15/5</button>`)}<div id=out></div></div>`};
C.bud=()=>{const k=[['needs','Needs','#3b82f6'],['wants','Wants','#f59e0b'],['sav','Savings','#10b981'],['inv','Investments','#8b5cf6'],['debt','Debt repayment','#f43f5e']],inc=M().inc;k.forEach(([a])=>S.b[a]=g('b_'+a));save();const t=sum(S.b);
out(card('Monthly plan on '+$(inc),`<table>${k.map(([a,b,c])=>`<tr><td style=color:${c}>● ${b}</td><td>${S.b[a]}%</td><td>${$(inc*S.b[a]/100)}</td></tr>`).join('')}</table>${bar(t,t==100?'var(--ac)':'var(--bad)')}<small>${t==100?'Totals 100%.':'Total is '+t+'% — adjust to reach 100%.'}</small><br><small>Your fixed expenses are ${$(S.p.fix)} vs needs budget ${$(inc*S.b.needs/100)}.</small>`))};
V.goals=()=>`<h1>Goal Planner</h1><div class=g2>${S.g.map((x,i)=>{const a=mos(x.c,x.t,x.m,0),b=mos(x.c,x.t,x.m,x.r);return card(x.n,`<small>${$(x.c)} of ${$(x.t)} · ${$(x.m)}/mo</small>${bar(x.c/x.t*100,'var(--ac2)')}<table><tr><td>A. Without returns</td><td><b>${dur(a)}</b></td></tr><tr><td>B. With ${x.r}% (assumed)</td><td><b>${dur(b)}</b></td></tr></table><small>Returns are assumptions, not guarantees.</small><br><button class=s onclick="S.g.splice(${i},1);save();render()">Remove</button>`)}).join('')}
${card('Add goal',`<label>Name<input id=gn placeholder="House"></label><label>Target<input id=gt type=number></label><label>Current<input id=gc type=number value=0></label><label>Monthly contribution<input id=gm type=number></label><label>Expected annual return %<input id=gr type=number value=${S.p.ret}></label><button onclick="S.g.push({n:gn.value||'Goal',t:+gt.value||1,c:+gc.value||0,m:+gm.value||0,r:+gr.value||0});save();render()">Add goal</button>`)}</div>`;
V.inv=()=>`<h1>Investments</h1><div class=g2>${card('Calculator (SIP · lump-sum · compound · inflation · future value)',N('i0','Initial investment',S.p.inv)+N('i1','Monthly investment',20000)+N('i2','Expected annual return % (assumption)',S.p.ret,.1)+N('i3','Years',15)+N('i4','Inflation %',6,.1)+N('s1','Scenario monthly amount',30000))}<div id=out></div></div>`;
C.inv=()=>{const P0=g('i0'),mo=g('i1'),r=g('i2'),y=g('i3'),inf=g('i4'),sa=g('s1'),f=fv(P0,mo,r,y),inv=P0+mo*12*y,lb=Array.from({length:y+1},(_,i)=>'Y'+i);
const row=t=>`<tr><td>${t} yrs</td><td>${$(sa*12*t)}</td><td>${$(fv(0,sa,r,t))}</td><td>${$(fv(0,sa,r,t,.1))}</td></tr>`;
out(card('Projection (assumed return)',`<b class=big>${$(f)}</b><small>Invested ${$(inv)} · Gains ${$(f-inv)} · In today's money ${$(f/(1+inf/100)**y)}</small>`+line([{n:'With return (assumed)',c:'#10b981',d:ser(P0,mo,r,y)},{n:'Contributions only',c:'#3b82f6',d:ser(P0,mo,0,y)}],lb))+card('Scenario simulator at '+$(sa)+'/mo',`<table><tr><th></th><th>A. Save (0%)</th><th>B. Invest @${r}%</th><th>C. Invest +10%/yr</th></tr>${[5,10,15,20].map(t=>`<tr><td>${t} yrs</td><td>${$(sa*12*t)}</td><td>${$(fv(0,sa,r,t))}</td><td>${$(fv(0,sa,r,t,.1))}</td></tr>`).join('')}</table><small>Projections use your assumed return; real returns vary and can be negative.</small>`))};
V.loan=()=>{const m=M();return `<h1>Loans & Car Affordability</h1><div class=g2>${card('Loan / car inputs',N('lp','Price / loan amount',1000000)+N('ld','Down payment',200000)+N('lr','Interest rate %',9,.1)+N('ly','Tenure (years)',5)+N('lc','Yearly running cost (fuel, insurance, upkeep)',60000))}<div id=out></div></div>`};
C.loan=()=>{const pr=g('lp'),dp=g('ld'),rt=g('lr'),y=g('ly'),rc=g('lc'),L=pr-dp,n=y*12,e=emi(L,rt,n),tot=e*n,it=tot-L,m=M();let b=L;const bs=[L];for(let k=1;k<=n;k++){b=b*(1+rt/1200)-e;if(k%12==0)bs.push(Math.max(b,0))}
const cmp=[[rt-1,y],[rt,y],[rt+1,y],[rt,y-2],[rt,y+2]].filter(x=>x[1]>0&&x[0]>=0).map(([a,c])=>{const e2=emi(L,a,c*12);return `<tr><td>${a}%</td><td>${c}y</td><td>${$(e2)}</td><td>${$(e2*c*12-L)}</td></tr>`}).join('');
out(card('EMI',`<b class=big>${$(e)}/mo</b><small>Total interest ${$(it)} · Total repayment ${$(tot)}</small>${bar(L/tot*100,'var(--ac2)')}<small>Principal ${(L/tot*100).toFixed(0)}% vs interest ${(it/tot*100).toFixed(0)}%</small>`+line([{n:'Outstanding balance',c:'#3b82f6',d:bs}],bs.map((_,i)=>'Y'+i)))+card('Impact on your cash flow',`<table><tr><td>EMI ÷ income</td><td><b>${(e/m.inc*100).toFixed(1)}%</b></td></tr><tr><td>Surplus after EMI</td><td><b>${$(m.sur-e)}</b></td></tr><tr><td>Est. total cost of ownership</td><td><b>${$(dp+tot+rc*y)}</b></td></tr></table><small>Rules of thumb (e.g. keeping vehicle costs under ~15–20% of income) are only guides. The decision is yours; this shows the trade-offs.</small>`)+card('Compare rate / tenure',`<table><tr><th>Rate</th><th>Tenure</th><th>EMI</th><th>Interest</th></tr>${cmp}</table>`))};
V.nw=()=>{const a=Object.keys(S.a),l=Object.keys(S.l);return `<h1>Net Worth</h1><div class=g2>${card('Assets',a.map((k,i)=>N('a'+i,k,S.a[k])).join(''))}${card('Liabilities',l.map((k,i)=>N('l'+i,k,S.l[k])).join(''))}<div id=out></div></div>`};
C.nw=()=>{Object.keys(S.a).forEach((k,i)=>S.a[k]=g('a'+i));Object.keys(S.l).forEach((k,i)=>S.l[k]=g('l'+i));save();const m=M();
out(card('Net worth',`<b class=big>${$(m.nw)}</b><small>Assets ${$(m.A)} − Liabilities ${$(m.L)}</small>`+line([{n:'History',c:'#10b981',d:S.h.map(x=>x.v)},],S.h.map(x=>x.l))+`<button onclick="S.h.push({l:new Date().toLocaleString('en',{month:'short'}),v:M().nw});save();render()">Save snapshot</button>`))};
const PA=q=>[...q.matchAll(/(\d[\d,]*\.?\d*)\s*(crore|cr|lakhs?|lacs?|k|m)?\b/g)].map(x=>parseFloat(x[1].replace(/,/g,''))*(/^cr/.test(x[2]||'')?1e7:/^la/.test(x[2]||'')?1e5:x[2]=='k'?1e3:x[2]=='m'?1e6:1)).filter(v=>v>0);
const R=(a,b,c,d,e,f)=>`<b>Short answer</b><br>${a}<br><br><b>Calculation & assumptions</b><br>${b}<br><br><b>Breakdown</b><br>${c}<br><br>${d?`<b>Scenarios</b><br>${d}<br><br>`:''}<b>Risks & uncertainty</b><br>${e}<br><br><b>Next steps</b><br>${f}<br><br><small>Educational information, not licensed advice. Returns are assumptions, not guarantees. Verify tax/legal/investment decisions with a qualified professional.</small>`;
function ans(q){const l=q.toLowerCase(),n=PA(q),m=M(),r=S.p.ret;
if(/car|afford/.test(l)){const pr=n[0]||1e6,dp=pr*.2,L=pr-dp,e=emi(L,9,60);return R(`A ${$(pr)} car would take about ${(e/m.inc*100).toFixed(1)}% of your income as EMI. Whether that fits is your call.`,`Assumes 20% down (${$(dp)}), 9% interest, 5 years.`,`EMI ${$(e)}/mo · Total interest ${$(e*60-L)} · Surplus after EMI ${$(m.sur-e)}/mo (now ${$(m.sur)})`,`Try a larger down payment or shorter tenure on the Loans tab.`,`Running costs (fuel, insurance, upkeep) and depreciation are not in the EMI; income may change.`,`Check the Loans tab with real quotes; confirm your emergency fund stays intact.`)}
if(/emergency/.test(l)){const nd=m.exp*6,gap=Math.max(0,nd-S.p.sav);return R(`A common target is 3–6 months of expenses: ${$(m.exp*3)}–${$(nd)}.`,`Based on your monthly expenses of ${$(m.exp)}.`,`Saved ${$(S.p.sav)} (${m.em.toFixed(1)} months) · Gap to 6 months ${$(gap)}`,`Setting aside half your surplus (${$(m.sur/2)}/mo) closes the gap in about ${dur(mos(S.p.sav,nd,Math.max(m.sur/2,1),0))}.`,`Needs vary with job stability and dependents.`,`Keep it in an easily accessible account, separate from investments.`)}
if(/(loan|debt).*(early|prepay|pay)|pay.*(loan|debt)/.test(l)){const a=n[0]||100000;return R(`Prepaying gives a certain saving; investing gives an uncertain return. Compare your loan rate against what you could reasonably expect.`,`Assumes a 10% loan rate and a ${r}% expected pre-tax investment return (both assumptions).`,`On ${$(a)}: prepaying saves about ${$(a*.1)}/yr (certain); investing might earn about ${$(a*r/100)}/yr (not guaranteed, taxable).`,'',`Prepayment penalties, tax benefits on loan interest and liquidity needs can change the answer.`,`Check your actual rate and any prepayment charges; keep your emergency fund first.`)}
if(/budget/.test(l)){return R(`Here is a plan for your ${$(m.inc)} monthly income.`,`Uses your saved split of ${S.b.needs}/${S.b.wants}/${S.b.sav}/${S.b.inv}/${S.b.debt}.`,`Needs ${$(m.inc*S.b.needs/100)} · Wants ${$(m.inc*S.b.wants/100)} · Savings ${$(m.inc*S.b.sav/100)} · Investments ${$(m.inc*S.b.inv/100)} · Debt ${$(m.inc*S.b.debt/100)}`,'',`Your actual expenses are ${$(m.exp)}; irregular costs can break any fixed split.`,`Adjust percentages on the Budget tab.`)}
if(/buy.*invest|invest.*buy|compar/.test(l)){const a=n[0]||1e6;return R(`Buying an asset and investing the same money behave differently; the outcome depends on appreciation, costs and your needs.`,`Assumes ${a?$(a):''} for 10 years, 5% asset appreciation vs ${r}% investment return (assumptions).`,`Asset: ${$(a*1.05**10)} · Invested: ${$(fv(a,0,r,10))} (before costs/tax)`,'',`Real returns vary; the purchase may also provide use value (e.g. a home).`,`Include maintenance, taxes and liquidity before deciding.`)}
if(/invest|sip/.test(l)){const a=n[0]||20000;return R(`Investing ${$(a)}/month for 10 years could grow to about ${$(fv(0,a,r,10))} if returns average ${r}% (an assumption).`,`Monthly compounding at ${r}% (adjustable in Settings).`,`5 yrs ${$(fv(0,a,r,5))} · 10 yrs ${$(fv(0,a,r,10))} · 20 yrs ${$(fv(0,a,r,20))} · Contributions in 10 yrs ${$(a*120)}`,`With 0% return: ${$(a*120)} after 10 years.`,`Markets fluctuate; returns can be lower or negative in any period.`,`Compare scenarios on the Investments tab.`)}
if(/reach|crore|lakh|how long/.test(l)){const t=n[0]||1e7,mo=n[1]||Math.max(m.sur,1);return R(`Reaching ${$(t)} could take about ${dur(mos(S.p.inv,t,mo,r))} at ${$(mo)}/mo with an assumed ${r}% return.`,`Starts from current investments ${$(S.p.inv)}.`,`Without returns: ${dur(mos(S.p.inv,t,mo,0))} · With ${r}% assumed: ${dur(mos(S.p.inv,t,mo,r))}`,'',`Inflation reduces purchasing power; returns are uncertain.`,`Create this as a goal on the Goals tab.`)}
if(/save/.test(l)){return R(`A common starting point is saving 20% of income, about ${$(m.inc*.2)}/month.`,`Your surplus is ${$(m.sur)} (${m.rate.toFixed(0)}% of income).`,`Savings ${$(m.inc*S.b.sav/100)} + investing ${$(m.inc*S.b.inv/100)} under your current budget split.`,'',`Needs depend on goals, dependents and income stability.`,`Automate transfers right after payday.`)}
return `I can help with: affordability of a car, monthly savings, reaching ₹1 crore, early loan payoff, investing ₹20,000/month, emergency fund, buying vs investing, and a monthly budget. Try one of the buttons below.`}
const qs=['Can I afford a car of 10 lakh?','How much emergency fund do I need?','What happens if I invest 20000 per month?','How long to reach 1 crore?','Should I pay my loan early?','Create a monthly budget for me'];
V.adv=()=>`<h1>AI Advisor</h1><div id=chat><div class="m a">Hi! Ask me about budgets, goals, loans or investing. I use your profile data. Educational guidance only, not a licensed advisor.</div></div><div class=row><input id=q placeholder="Ask a money question…" onkeydown="if(event.key=='Enter')send()"><button onclick=send()>Send</button></div><div>${qs.map(x=>`<button class=s onclick="q.value=this.textContent;send()">${x}</button>`).join('')}</div>`;
